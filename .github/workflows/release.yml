# Every push to main: build, test, package Windows (x64/arm64) and macOS (arm64/x64), and publish a GitHub release
# tagged v<major>.<minor>.<commit count> with the zips and SHA256SUMS. Pull requests and other branches: build + test only.
name: build-and-release

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - id: version
        run: |
          prefix=$(sed -n 's:.*<VersionPrefix>\([0-9]*\.[0-9]*\).*</VersionPrefix>.*:\1:p' Directory.Build.props)
          echo "version=${prefix}.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
      - run: dotnet build ScreenRec.sln -c Release
      - run: dotnet test tests/ScreenRec.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

  windows:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test on Windows
        if: matrix.arch == 'x64'
        run: dotnet test tests/ScreenRec.Core.Tests -c Release
      - name: Publish
        shell: pwsh
        run: |
          $v = "${{ needs.test.outputs.version }}"
          $out = "out/ScreenRecTrainer"
          dotnet publish src/ScreenRec.App -c Release -r win-${{ matrix.arch }} --self-contained -p:Version=$v -o $out
          dotnet publish src/ScreenRec.Cli -c Release -r win-${{ matrix.arch }} --self-contained -p:Version=$v -o $out
          Copy-Item README.md $out
          Compress-Archive -Path "$out/*" -DestinationPath "ScreenRecTrainer-$v-win-${{ matrix.arch }}.zip"
      - name: UI self-test
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          $env:SCREENREC_HOME = "$env:RUNNER_TEMP/srhome"
          out/ScreenRecTrainer/screenrec.exe demo
          $p = Start-Process out/ScreenRecTrainer/ScreenRecTrainer.exe -ArgumentList "--self-test","$env:RUNNER_TEMP/shots" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "self-test failed ($($p.ExitCode))" }
          Get-ChildItem "$env:RUNNER_TEMP/shots"
      - name: Build MSI installer
        shell: pwsh
        run: |
          $v = "${{ needs.test.outputs.version }}"
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          wix extension add -g WixToolset.UI.wixext/5.0.2
          # PublishDir must be absolute (WiX resolves relative paths against the .wxs folder), forward-slashed
          # and WITHOUT a trailing separator — "D:\...\dir\" + "/**" silently harvests nothing on Windows.
          $pub = ((Resolve-Path "out/ScreenRecTrainer").Path).Replace('\', '/')
          Write-Host "PublishDir=$pub; files=$($(Get-ChildItem $pub -File).Count)"
          wix build -arch ${{ matrix.arch }} -ext WixToolset.UI.wixext `
            -d "Version=$v" -d "PublishDir=$pub" `
            -o "ScreenRecTrainer-$v-win-${{ matrix.arch }}.msi" packaging/windows/ScreenRecTrainer.wxs
          if ($LASTEXITCODE -ne 0) { throw "wix build failed with exit code $LASTEXITCODE" }
          Get-ChildItem -Recurse -Filter *.cab | Select-Object FullName, Length
          $msi = Get-Item "ScreenRecTrainer-$v-win-${{ matrix.arch }}.msi"
          if ($msi.Length -lt 50MB) { throw "MSI is only $($msi.Length) bytes — the payload was not embedded" }
          $msi | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win-${{ matrix.arch }}
          path: |
            ScreenRecTrainer-*.zip
            ScreenRecTrainer-*.msi

  macos:
    needs: test
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Package .app and .dmg
        run: |
          v="${{ needs.test.outputs.version }}"
          sed -i '' "s#<string>1.0.0</string>#<string>$v</string>#g" packaging/macos/Info.plist
          ./scripts/package-mac.sh ${{ matrix.rid }}
          mv "artifacts/${{ matrix.rid }}/ScreenRecTrainer-${{ matrix.rid }}.dmg" "ScreenRecTrainer-$v-${{ matrix.rid }}.dmg"
          mv "artifacts/${{ matrix.rid }}/screenrec-cli-${{ matrix.rid }}.zip" "screenrec-cli-$v-${{ matrix.rid }}.zip"
      - name: UI self-test
        if: matrix.rid == 'osx-arm64'
        run: |
          export SCREENREC_HOME="$RUNNER_TEMP/srhome"
          artifacts/osx-arm64/cli/screenrec demo
          "artifacts/osx-arm64/ScreenRec Trainer.app/Contents/MacOS/ScreenRecTrainer" --self-test "$RUNNER_TEMP/shots"
          ls "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            ScreenRecTrainer-*.dmg
            screenrec-cli-*.zip

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd dist && sha256sum *.msi *.dmg *.zip > SHA256SUMS && cat SHA256SUMS && cd ..
          prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "## ScreenRec Trainer v${{ needs.test.outputs.version }}"
            echo
            echo "| Download | For |"
            echo "|---|---|"
            echo "| \`ScreenRecTrainer-*-win-x64.msi\` | **Windows 10/11 (Intel/AMD) — installer** (GUI + CLI, Start Menu shortcut, CLI on PATH) |"
            echo "| \`ScreenRecTrainer-*-win-arm64.msi\` | **Windows on ARM — installer** |"
            echo "| \`ScreenRecTrainer-*-win-*.zip\` | Windows, portable (no install) — unzip and run \`ScreenRecTrainer.exe\` |"
            echo "| \`ScreenRecTrainer-*-osx-arm64.dmg\` | **Mac with Apple silicon — installer** — open the .dmg and drag the app to Applications |"
            echo "| \`ScreenRecTrainer-*-osx-x64.dmg\` | **Intel Mac — installer** |"
            echo "| \`screenrec-cli-*.zip\` | macOS command line |"
            echo
            echo "First launch on macOS: right-click the app › **Open** (it is ad-hoc signed, not notarized). Then allow"
            echo "**Screen Recording** and **Input Monitoring** for it in System Settings › Privacy & Security."
            echo
            echo "### Changes"
            if [ -n "$prev" ]; then git log --pretty='- %s (%h)' "$prev"..HEAD; else git log --pretty='- %s (%h)' -20; fi
          } > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.test.outputs.version }}"
          gh release create "$tag" dist/*.msi dist/*.dmg dist/*.zip dist/SHA256SUMS --target "$GITHUB_SHA" --title "ScreenRec Trainer $tag" --notes-file notes.md --latest
